# GDAL OSM driver configuration used by the pipeline.
#
# It exposes exactly the OSM tags the pipeline filters on as first-class
# attribute columns (so we can push filters down with SQL WHERE clauses) and
# tells the driver which closed ways to treat as polygons. Pointed at via the
# OSM_CONFIG_FILE config option (see osm.py).

[general]
attribute_name_laundering=yes
report_all_nodes=no
report_all_ways=no
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,man_made,military,natural,office,place,shop,sport,tourism,water,waterway

[points]
osm_id=yes
attributes=name,place,population,aeroway,military,man_made
other_tags=no

[lines]
osm_id=yes
attributes=name,highway,waterway,aeroway,railway,ref
other_tags=no

[multipolygons]
osm_id=yes
osm_way_id=yes
attributes=name,natural,water,waterway,landuse,aeroway,military,boundary,admin_level,place,population
other_tags=no

[multilinestrings]
osm_id=yes
attributes=name,type
other_tags=no

[other_relations]
osm_id=yes
attributes=name,type
other_tags=no
