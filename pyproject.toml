[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geofabrik-pipeline"
version = "0.1.0"
description = "Data pipeline that builds clipped, simplified GeoPackages of country and inland-water polygons from Geofabrik OSM extracts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.7",
    "requests>=2.25",
    "pandas>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
geofabrik-pipeline = "geofabrik_pipeline.cli:main"

[tool.setuptools]
packages = ["geofabrik_pipeline"]
