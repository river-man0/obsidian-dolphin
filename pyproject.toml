[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geofabrik-pipeline"
version = "0.2.0"
description = "Data pipeline that builds clipped, simplified GeoPackage/GeoParquet layers (countries, water, roads, airports, population centres, military) from Geofabrik OSM .pbf extracts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.7",
    "pyarrow>=10",
    "requests>=2.25",
    "pandas>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
geofabrik-pipeline = "geofabrik_pipeline.cli:main"

[tool.setuptools]
packages = ["geofabrik_pipeline"]

[tool.setuptools.package-data]
geofabrik_pipeline = ["osmconf.ini"]
